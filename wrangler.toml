name = "dnsmgr-cf"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "dnsmgr"
database_id = "365fc304-9ece-42f7-8adf-d65fe4d74deb"

# 证书签发/续签本身已经搬到 GitHub Actions 里跑（见 .github/workflows/），
# 续签检查由 .github/workflows/renew-certs.yml 的 schedule 触发。
# 这里的 Cron Trigger 只用于「域名/证书到期提醒通知」，是轻量任务（只查数据库+发通知，
# 没有ACME签名运算），放在 Workers 里跑没有CPU限制问题。
# 0 0 * * * = 每天 UTC 00:00 = 北京时间每天 08:00
[triggers]
crons = ["0 0 * * *"]

[vars]
# 非敏感配置，敏感项请用 `wrangler secret put` 设置：
# JWT_SECRET, ACME_ACCOUNT_EMAIL, GITHUB_TOKEN, CI_CALLBACK_SECRET,
# ACME_EAB_KID（如用ZeroSSL）, ACME_EAB_HMAC_KEY（如用ZeroSSL）
APP_NAME = "DNSMGR-CF"
JWT_EXPIRE_SECONDS = "86400"
APPLINK_EXPIRE_SECONDS = "300"
CI_TOKEN_EXPIRE_SECONDS = "1800"
GITHUB_OWNER = "alay2022"
GITHUB_REPO = "dnsmgr-cf"
GITHUB_REF = "main"
# 可选：如遇到 Cloudflare Workers 访问 Let's Encrypt 的已知525问题（见README「已知问题」），
# 取消下面这行注释切换到 ZeroSSL（免费，但需要额外配置EAB凭据，见README说明）：
# ACME_DIRECTORY_URL = "https://acme.zerossl.com/v2/DV90"

# 可选：第三方登录（GitHub/Google/NodeLoc），不配置就不会显示对应的登录按钮。
# Client ID 不是敏感信息可以放这里，Client Secret 必须用 wrangler secret put 设置。
OAUTH_REDIRECT_BASE = "https://dnsmgr-cf.alay.workers.dev"
FRONTEND_BASE = "https://dns.ztvps.com"
GITHUB_OAUTH_CLIENT_ID = "837743661786-dghh87lp20d94gu3bpmfh0m1eubnt2ei.apps.googleusercontent.com"
# GOOGLE_OAUTH_CLIENT_ID = ""
NODELOC_OAUTH_CLIENT_ID = "4a1de5cd-a3fa-4bb8-b86f-090da8d9e3e8"
NODELOC_OAUTH_AUTHORIZE_URL = "https://www.nodeloc.com/oauth-provider/authorize"
NODELOC_OAUTH_TOKEN_URL = "https://www.nodeloc.com/oauth-provider/token"
NODELOC_OAUTH_USERINFO_URL = "https://www.nodeloc.com/oauth-provider/userinfo"
NODELOC_OAUTH_SCOPE = "openid profile email"

# 可选：MiSub订阅管理里，把订阅转换成Clash/Surge/singbox等客户端专属格式时用到的subconverter服务地址。
# 不配置的话只能用通用(base64)格式，大多数客户端（V2rayN/V2rayNG/Shadowrocket等）都认这个格式，够用。
# 公开的subconverter实例可以自己搜，或者自建一个（推荐，公开实例不稳定也有隐私风险）：https://github.com/tindy2013/subconverter
# MISUB_SUBCONVERTER_URL = "https://your-subconverter.example.com/sub"
