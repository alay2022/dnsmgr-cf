name: Renew SSL Certificates (Scheduled)

on:
  schedule:
    - cron: "0 2 * * *" # 每天 UTC 02:00（北京时间 10:00）跑一次
  workflow_dispatch: {} # 也支持手动触发，方便调试

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Find and renew certs due for renewal
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          DNSMGR_API_KEY: ${{ secrets.DNSMGR_API_KEY }}
          DNSMGR_API_SECRET: ${{ secrets.DNSMGR_API_SECRET }}
          CI_CALLBACK_SECRET: ${{ secrets.CI_CALLBACK_SECRET }}
          ACME_ACCOUNT_EMAIL: ${{ secrets.ACME_ACCOUNT_EMAIL }}
          ACME_DIRECTORY_URL: ${{ secrets.ACME_DIRECTORY_URL }}
          ACME_EAB_KID: ${{ secrets.ACME_EAB_KID }}
          ACME_EAB_HMAC_KEY: ${{ secrets.ACME_EAB_HMAC_KEY }}
        run: npx tsx scripts/renew-certs.ts
